[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisrag"
version = "0.1.0"
description = "Enterprise RAG for private PDF intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishanth" }]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "langchain>=0.3,<1", "langchain-community>=0.3,<1",
  "langchain-openai>=0.2,<1", "langchain-chroma>=0.1,<1",
  "chromadb>=0.5,<2", "pypdf>=5,<7",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.12,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.7,<1", "mypy>=1.13,<2"]
[project.scripts]
aegisrag = "aegisrag.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/aegisrag"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=aegisrag --cov-report=term-missing"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
strict = true
